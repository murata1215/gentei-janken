[project]
name = "gentei-janken"
version = "0.1.0"
description = "嘘八百万 —限定ジャンケン— ルールエンジン"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.121.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "matplotlib>=3.11.1",
    "openai>=2.53.0",
    "playwright>=1.62.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "scipy>=1.18.0",
    "uvicorn>=0.52.1",
]

[tool.uv]
# アプリケーション本体（engine/llm/bots/viewer/scripts）はトップレベルパッケージとして
# 直接importするだけで、配布用の src/ レイアウトは持たない（dangou-cardのsrc/dangou_card/
# は死にコードだった。本プロジェクトでは最初から持たない）。
package = false
